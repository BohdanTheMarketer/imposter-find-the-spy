name: ImposterGame
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  Amplitude:
    url: https://github.com/amplitude/Amplitude-Swift
    from: 1.0.0
  AmplitudeSessionReplay:
    url: https://github.com/amplitude/AmplitudeSessionReplay-iOS
    from: 0.12.0
options:
  bundleIdPrefix: com.imposter
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  developmentLanguage: en
fileGroups:
  - ImposterGame/en.lproj
  - ImposterGame/pt-BR.lproj
  - ImposterGame/fr.lproj
  - ImposterGame/es-MX.lproj
  - ImposterGame/tr.lproj
schemes:
  ImposterGame:
    build:
      targets:
        ImposterGame: all
    run:
      config: Debug
      commandLineArguments:
        "-FIRDebugEnabled": true
        "-FIRAnalyticsDebugEnabled": true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIAppFonts:
      - LibreBaskerville-Regular.ttf
      - LibreBaskerville-Medium.ttf
      - LibreBaskerville-SemiBold.ttf
      - LibreBaskerville-Bold.ttf
      - LibreBaskerville-Italic.ttf
      - LibreBaskerville-MediumItalic.ttf
      - LibreBaskerville-SemiBoldItalic.ttf
      - LibreBaskerville-BoldItalic.ttf
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_CFBundleIconName: AppIcon
    INFOPLIST_KEY_UIBackgroundModes:
      - remote-notification
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  ImposterGame:
    type: application
    platform: iOS
    entitlements:
      path: ImposterGame/ImposterGame.entitlements
    configFiles:
      Debug: ImposterGame/Secrets.xcconfig
      Release: ImposterGame/Secrets.xcconfig
    sources:
      - path: ImposterGame
        excludes:
          - "Resources/WordPacks"
          - "Resources/WordPacks/**"
          - "Resources/WordPacks/**/*"
    dependencies:
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseInstallations
      - package: Firebase
        product: FirebaseMessaging
      - package: Amplitude
        product: AmplitudeSwift
      - package: AmplitudeSessionReplay
        product: AmplitudeSwiftSessionReplayPlugin
    preBuildScripts:
      - name: Generate Secrets
        basedOnDependencyAnalysis: false
        script: |
          set -e
          OUTPUT_DIR="${SRCROOT}/ImposterGame/Generated"
          mkdir -p "${OUTPUT_DIR}"
          cat > "${OUTPUT_DIR}/GeneratedSecrets.swift" <<EOF
          // AUTO-GENERATED at build time from ImposterGame/Secrets.xcconfig.
          // Do NOT edit this file by hand and do NOT commit it — it's regenerated on every
          // build from OPENAI_API_KEY (see project.yml) and is gitignored.
          enum GeneratedSecrets {
              static let openAIAPIKey = "${OPENAI_API_KEY}"
          }
          EOF
        outputFiles:
          - ${SRCROOT}/ImposterGame/Generated/GeneratedSecrets.swift
    postBuildScripts:
      - name: Copy WordPacks (preserve directory structure)
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${PROJECT_DIR}/ImposterGame/Resources/WordPacks"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/WordPacks"
          mkdir -p "${DEST}"
          rsync -a --delete "${SRC}/" "${DEST}/"
      - name: Firebase Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - $(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)
    resources:
      - path: ImposterGame/Assets.xcassets
        buildPhase: resources
      - path: ImposterGame/Resources/Onboarding
        buildPhase: resources
      - path: ImposterGame/Resources/PlayerAvatars
        buildPhase: resources
      - path: ImposterGame/Resources/CategoryIcons
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-Regular.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-Medium.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-SemiBold.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-Bold.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-Italic.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-MediumItalic.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-SemiBoldItalic.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Fonts/LibreBaskerville-BoldItalic.ttf
        buildPhase: resources
      - path: ImposterGame/Resources/Assets.xcassets
        buildPhase: resources
      - path: ImposterGame/GoogleService-Info.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danetka.Danetka
        DEVELOPMENT_TEAM: Q35PSLMDJH
        # 1 = iPhone, 2 = iPad (required for iPad Simulator / universal App Store)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: "Imposter"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Alt
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        INFOPLIST_KEY_CFBundleLocalizations:
          - en
          - pt-BR
          - fr
          - es-MX
          - tr
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
